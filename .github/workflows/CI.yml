name: CI

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" mypy

      - name: Ruff Lint
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

      # The codebase relies on lazy __getattr__ imports and sqlite Row access that
      # mypy cannot resolve yet; keep the report visible without blocking the build.
      - name: MyPy
        continue-on-error: true
        run: mypy --ignore-missing-imports src

  smoke:
    name: Core Smoke Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import Smoke Test
        run: |
          # RLIMIT_AS does not exist on macOS, so only cap Linux runs.
          if [ "$RUNNER_OS" = "Linux" ]; then ulimit -v 2400000; fi
          python -c "import cli, agent.runtime, config; print('core import ok')"

  test:
    name: Pytest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
  
      - name: Install Bubblewrap
        # Bubblewrap only exists on Linux; the macOS runners use sandbox-exec.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Allow Bubblewrap user namespaces
        # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which
        # denies the CAP_NET_ADMIN that bwrap needs to configure loopback in its
        # network namespace ("Failed RTM_NEWADDR: Operation not permitted").
        if: runner.os == 'Linux'
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          probe() { bwrap --unshare-all --ro-bind / / --die-with-parent /bin/true; }
          if ! probe; then
            # Fallback for runners without a loaded AppArmor policy set.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          if ! probe; then
            echo "::error::Bubblewrap cannot create an isolated namespace on this runner"
            exit 1
          fi
  
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
  
      - name: Run Tests
        run: |
          # Keep the test process inside a 2.4 GB virtual-memory ceiling.
          # macOS has no RLIMIT_AS, so the cap only applies to Linux runs.
          if [ "$RUNNER_OS" = "Linux" ]; then ulimit -v 2400000; fi
          pytest -q --tb=short

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Bandit
        run: |
          bandit -r src -ll

      - name: Pip Audit
        run: |
          pip-audit

  performance:
    name: Performance Profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install py-spy

      - name: Profile Imports
        run: |
          python -X importtime -c "import agent.runtime" \
            2> importtime.txt

      - name: Benchmark CLI Startup
        run: |
          /usr/bin/time -v private-agent --help

      - name: Generate Flame Graph
        run: |
          # Keep the target alive long enough for py-spy to attach and sample;
          # `private-agent --help` exits before the profiler can read it.
          py-spy record \
            -o flamegraph.svg \
            -- python -c "import time, agent.runtime; time.sleep(3)"

      - name: Upload Profiling Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-profile
          path: |
            importtime.txt
            flamegraph.svg

      - name: Startup Benchmark
        run: |
          STARTUP_TIME=$(/usr/bin/time -f "%e" private-agent --help 2>&1 >/dev/null)
          {
            echo "# Performance Report"
            echo ""
            echo "| Metric | Value |"
            echo "|----------|----------|"
            echo "| Startup Time | ${STARTUP_TIME}s |"
          } >> "$GITHUB_STEP_SUMMARY"