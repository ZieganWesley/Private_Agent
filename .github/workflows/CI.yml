name: CI

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install bubblewrap
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" mypy

      - name: Ruff Lint
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

      # The codebase relies on lazy __getattr__ imports and sqlite Row access that
      # mypy cannot resolve yet; keep the report visible without blocking the build.
      - name: MyPy
        continue-on-error: true
        run: mypy --ignore-missing-imports src

  smoke:
    name: Core Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import Smoke Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then ulimit -v 2400000; fi
          python -c "import cli, agent.runtime, config; print('core import ok')"

  test:
    name: Pytest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
  
    runs-on: ${{ matrix.os }}
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
  
      - name: Install Bubblewrap
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y bubblewrap
              ;;
            macOS)
              brew install bubblewrap
              ;;
          esac
  
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
  
      - name: Run Tests
        run: |
          # Keep the test process inside a 2.4 GB virtual-memory ceiling.
          # macOS does not implement RLIMIT_AS, so the cap only applies on Linux.
          if [ "$RUNNER_OS" = "Linux" ]; then ulimit -v 2400000; fi
          pytest -q
