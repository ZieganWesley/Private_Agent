name: Core Smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install .
      - run: python -c "import cli, agent.runtime, config; print('core import ok')"
